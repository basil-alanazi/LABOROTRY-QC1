# Cloudflare deployment for the Infection Control site.
# The Worker serves the built React app from ../dist and the /api + /files routes.
name = "infection-control"
main = "worker/index.js"
compatibility_date = "2025-09-01"

[assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/files/*"]

[[d1_databases]]
binding = "DB"
database_name = "infection-control"

database_id = "581a5a47-7ef0-4384-88c9-4c1b810e1761"

[[r2_buckets]]
binding = "FILES"
bucket_name = "infection-control-files"

[observability]
enabled = true
